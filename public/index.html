<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wojna Pastwisk</title><link rel="stylesheet" href="/style.css"></head><body><main><section id="start" class="screen start"><img src="/assets/start_screen.png" onerror="this.hidden=true"><div class="shade"></div><div class="startbox"><h1>Wojna Pastwisk</h1><p>Walczcie owcami i zwyciężajcie!</p><button id="botMode" class="primary">Graj sam z botem</button><button id="tvMode">TV + 2 telefony</button><button id="joinMode">Dołącz telefonem</button><button id="settingsBtn">Ustawienia</button></div></section><section id="lobby" class="screen center hidden"><div class="card"><h2>Pokój TV</h2><p>Na telefonach wybierz „Dołącz telefonem” i wpisz kod:</p><div id="roomCode">-----</div><div id="slots"><span>Gracz 1: czekamy…</span><span>Gracz 2: czekamy…</span></div><button id="startMulti" class="primary" disabled>Rozpocznij</button><button class="back">Wróć</button></div></section><section id="join" class="screen center hidden"><form id="joinForm" class="card"><h2>Dołącz do TV</h2><label>Kod<input id="joinCode" maxlength="5" required></label><label>Nazwa<input id="playerName" value="Owca bojowa"></label><p id="joinError"></p><button class="primary">Dołącz</button><button type="button" class="back">Wróć</button></form></section><section id="controller" class="screen controller hidden"><header><b id="controllerSide">Gracz</b><span id="controllerHp">HP 4600</span></header><div class="stats"><span id="cGrass">🌿 0</span><span id="cWool">☁️ 0</span><span id="cGlory">🏆 0</span></div><div class="grid"><button data-buy="goat">Koza 40</button><button data-buy="sheep">Owca 80</button><button data-buy="ram">Baran 160</button></div><label>Kąt<input id="angleInput" type="range" min="20" max="75" value="45"><output id="angleOut">45°</output></label><label>Siła<input id="powerInput" type="range" min="25" max="100" value="62"><output id="powerOut">62%</output></label><button id="controllerFire" class="fire">WYSTRZEL!</button><h3>Rozwój stada</h3><div class="grid upgrades"><button data-upgrade="herd">Stado</button><button data-upgrade="catapult">Katapulta</button><button data-upgrade="fence">Płot</button><button data-upgrade="workshop">Warsztat</button></div><p id="controllerWait">Czekamy na TV…</p></section><section id="game" class="screen game hidden"><div id="world"><div class="sky"></div><div id="wind"></div><div id="timer"></div><div id="hud0" class="hud left"></div><div id="hud1" class="hud right"></div><div id="side0" class="fort fleft"></div><div id="side1" class="fort fright"></div><div id="units"></div><div id="shots"></div><div id="clouds"></div><div id="controls"><div><button data-buy="goat">+ Koza 40</button><button data-buy="sheep">+ Owca 80</button><button data-buy="ram">+ Baran 160</button></div><div><label>Kąt <input id="gameAngle" type="range" min="20" max="75" value="45"><output>45°</output></label><label>Siła <input id="gamePower" type="range" min="25" max="100" value="62"><output>62%</output></label><button id="gameFire" class="fire">STRZAŁ</button></div><div><b>Rozwój stada</b><button data-upgrade="herd">Stado</button><button data-upgrade="catapult">Katapulta</button><button data-upgrade="fence">Płot</button><button data-upgrade="workshop">Warsztat</button></div></div><div id="countdown" class="overlay hidden"></div><div id="result" class="overlay hidden"><h2></h2><button id="again">Jeszcze raz</button><button id="home">Menu</button></div></div></section><dialog id="settings"><form method="dialog"><h2>Ustawienia</h2><label><input id="musicEnabled" type="checkbox" checked> Muzyka</label><label>Głośność<input id="musicVolume" type="range" min="0" max="1" value=".35" step=".05"></label><button>Zamknij</button></form></dialog></main><audio id="music" src="/assets/music.mp3" loop></audio><script src="/socket.io/socket.io.js"></script><script src="/js/game-core.js"></script><script src="/js/game.js"></script></body></html>
